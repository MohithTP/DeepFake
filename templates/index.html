<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Shield | Secure Media Transfer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0B0F19',
                            card: '#151B2B',
                            accent: '#3B82F6',
                            success: '#10B981',
                            danger: '#EF4444',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'scan': 'scan 2s linear infinite',
                    },
                    keyframes: {
                        scan: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #e2e8f0;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-strong {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Chat Bubbles */
        .msg-bubble {
            position: relative;
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .msg-bubble.own {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg-bubble.other {
            background: rgba(51, 65, 85, 0.8);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        /* Scan Effect */
        .scan-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(59, 130, 246, 0.2), transparent);
            z-index: 10;
            animation: scan 2s linear infinite;
            pointer-events: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>

<body class="h-screen w-screen overflow-hidden flex items-center justify-center p-4">

    <!-- Login Screen -->
    <div id="login-screen"
        class="glass-strong p-8 rounded-2xl shadow-2xl w-full max-w-md text-center transform transition-all duration-300">
        <div class="mb-6 flex justify-center">
            <div
                class="w-16 h-16 bg-blue-500/20 rounded-full flex items-center justify-center border border-blue-500/50">
                <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.2-2.858.578-4.18M12 21a9.003 9.003 0 008.716-6.747M12 21a9.003 9.003 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S13.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418">
                    </path>
                </svg>
            </div>
        </div>
        <h1 class="text-3xl font-bold mb-2 tracking-tight">Deepfake Shield</h1>
        <p class="text-gray-400 mb-8 text-sm">Secure SaaS Media Gateway</p>

        <input type="text" id="username-input"
            class="w-full bg-brand-card border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition mb-4"
            placeholder="Enter your alias (e.g. Alice)">

        <button onclick="joinChat()"
            class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg transition-all shadow-lg shadow-blue-500/30">
            Enter Dashboard
        </button>
    </div>

    <!-- Main Dashboard -->
    <div id="chat-screen"
        class="hidden w-full max-w-5xl h-[90vh] glass rounded-2xl flex flex-col overflow-hidden shadow-2xl border border-gray-700/50">

        <!-- Header -->
        <div class="h-16 border-b border-gray-700/50 flex justify-between items-center px-6 bg-black/20">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
                <h2 class="font-semibold tracking-wide">Secure Broadcast Channel</h2>
            </div>
            <div class="flex items-center gap-4">
                <div id="current-user"
                    class="text-sm font-medium text-gray-300 bg-white/5 px-3 py-1 rounded-full border border-white/10">
                </div>
            </div>
        </div>

        <!-- Layout: Chat Area + Status Sidepanel? No, let's keep it simple vertical for better mobile support or single view -->
        <!-- Chat Area -->
        <div id="messages" class="flex-1 overflow-y-auto p-6 flex flex-col gap-4">
            <div class="message system text-center text-gray-500 text-xs uppercase tracking-widest my-4">Encryption
                Verified • Channel Active</div>
            <!-- Messages injected here -->
        </div>

        <!-- Upload & Status Bar -->
        <div class="p-6 bg-black/30 border-t border-gray-700/50">

            <!-- Dynamic Status Area -->
            <div id="upload-status-area"
                class="hidden mb-4 p-4 rounded-xl bg-gray-900/50 border border-gray-700/50 flex flex-col gap-2 relative overflow-hidden transition-all">
                <div class="flex justify-between items-start">
                    <div>
                        <div id="status-title" class="font-bold text-sm uppercase tracking-wider mb-1">Scanning Media...
                        </div>
                        <div id="status-desc" class="text-xs text-gray-400">Analyzing patterns with DSMPE Dual-Stream
                            Network</div>
                    </div>
                </div>

                <!-- Progress/Visualizer -->
                <div id="loader-bar" class="h-1 w-full bg-gray-700 rounded-full mt-2 overflow-hidden">
                    <div
                        class="h-full bg-blue-500 animate-progress w-full origin-left scale-x-0 transition-transform duration-[2000ms]">
                    </div>
                </div>

                <!-- Patch Grid (Initially Hidden) -->
                <div id="patch-grid-container" class="hidden mt-3 pt-3 border-t border-gray-700/50">
                    <div class="text-[10px] text-gray-400 uppercase tracking-widest mb-2">Patch Anomaly Heatmap</div>
                    <div id="patch-grid" class="grid grid-cols-3 gap-1 w-24 h-24 mx-auto"></div>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex gap-3">
                <label
                    class="cursor-pointer flex items-center justify-center w-12 h-12 rounded-xl bg-gray-700 hover:bg-gray-600 transition text-gray-300 border border-gray-600">
                    <input type="file" id="file-input" class="hidden" accept="image/*,video/*">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13">
                        </path>
                    </svg>
                </label>

                <div class="flex-1 bg-brand-card rounded-xl border border-gray-600 flex items-center px-4 text-gray-400 text-sm"
                    id="filename-display">
                    Select a file to broadcast...
                </div>

                <button onclick="uploadMedia()"
                    class="px-6 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold transition shadow-lg shadow-blue-500/20 flex items-center gap-2">
                    <span>Broadcast</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast"
        class="fixed top-6 right-6 p-4 rounded-xl glass shadow-2xl transform translate-x-64 transition-transform duration-300 hidden flex items-center gap-3 z-50 border-l-4">
        <div id="toast-icon"></div>
        <div>
            <div id="toast-title" class="font-bold text-sm"></div>
            <div id="toast-msg" class="text-xs text-gray-300"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let username = '';
        const fileInput = document.getElementById('file-input');

        fileInput.addEventListener('change', (e) => {
            const name = e.target.files[0]?.name || "Select a file to broadcast...";
            document.getElementById('filename-display').innerText = name;
            document.getElementById('filename-display').style.color = e.target.files[0] ? '#fff' : '#9ca3af';
        });

        function joinChat() {
            const input = document.getElementById('username-input');
            username = input.value.trim();
            if (!username) return hoverShake(input);

            document.getElementById('login-screen').classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('chat-screen').classList.remove('hidden');
                document.getElementById('current-user').innerText = `${username}`;
                socket.emit('join', { username: username });
            }, 300);
        }

        socket.on('status_message', (data) => addSystemMessage(data.msg));

        socket.on('new_media', (data) => {
            addMediaMessage(data);
            showToast('Incoming Transmission', `New media from ${data.username}`, 'success');
        });

        socket.on('status_update', (data) => {
            const statusDesc = document.getElementById('status-desc');
            if (statusDesc) {
                statusDesc.innerText = data.msg;
                // Add excitement
                statusDesc.classList.remove('text-gray-400');
                statusDesc.classList.add('text-blue-300', 'animate-pulse');
                setTimeout(() => statusDesc.classList.remove('animate-pulse'), 500);
            }
        });

        async function uploadMedia() {
            const file = fileInput.files[0];
            if (!file) return;

            // UI: Start Scanning State
            const statusArea = document.getElementById('upload-status-area');
            const statusTitle = document.getElementById('status-title');
            const statusDesc = document.getElementById('status-desc');
            const patchGrid = document.getElementById('patch-grid-container');
            const loader = document.getElementById('loader-bar').firstElementChild;

            statusArea.classList.remove('hidden');
            patchGrid.classList.add('hidden');
            statusArea.className = "mb-4 p-4 rounded-xl bg-blue-900/20 border border-blue-500/30 relative overflow-hidden transition-all";
            statusTitle.innerText = "RUNNING DEEPFAKE DETECTION...";
            statusTitle.className = "font-bold text-sm uppercase tracking-wider mb-1 text-blue-400";
            statusDesc.innerText = "Analyzing frame artifacts and frequency consistencies...";

            // Animate Loader
            loader.style.transition = 'none';
            loader.style.transform = 'scaleX(0)';
            setTimeout(() => {
                loader.style.transition = 'transform 2s ease-in-out';
                loader.style.transform = 'scaleX(1)';
            }, 10);

            const formData = new FormData();
            formData.append('file', file);
            formData.append('username', username);
            if (socket.id) formData.append('socket_id', socket.id);

            try {
                const response = await fetch('/api/upload', { method: 'POST', body: formData });
                const result = await response.json();

                // Keep visually "processing" for at least 1.5s so user sees the animation
                setTimeout(() => {
                    handleResult(result, file.name);
                }, 1500);

            } catch (err) {
                console.error(err);
                statusArea.classList.add('hidden');
                showToast('Error', 'Upload failed', 'error');
            }
        }

        function handleResult(result, fileName) {
            const statusArea = document.getElementById('upload-status-area');
            const statusTitle = document.getElementById('status-title');
            const statusDesc = document.getElementById('status-desc');
            const patchContainer = document.getElementById('patch-grid-container');
            const patchGrid = document.getElementById('patch-grid');

            if (result.status === 'blocked') {
                statusArea.className = "mb-4 p-4 rounded-xl bg-red-900/20 border border-red-500/50 relative overflow-hidden transition-all";
                statusTitle.innerText = "THREAT BLOCKED";
                statusTitle.className = "font-bold text-sm uppercase tracking-wider mb-1 text-red-400";
                statusDesc.innerText = `Deepfake detected with score ${result.score.toFixed(4)}. Media dropped.`;
                showToast('Security Alert', 'Malicious content blocked', 'error');

                // Show Grid
                if (result.patch_scores) {
                    renderGrid(result.patch_scores, patchGrid);
                    patchContainer.classList.remove('hidden');
                }

            } else if (result.status === 'success') {
                statusArea.className = "mb-4 p-4 rounded-xl bg-green-900/20 border border-green-500/50 relative overflow-hidden transition-all";
                statusTitle.innerText = "VERIFIED AUTHENTIC";
                statusTitle.className = "font-bold text-sm uppercase tracking-wider mb-1 text-green-400";
                statusDesc.innerText = `Content safe (Score: ${result.score.toFixed(4)}). Broadcasting to secure channel...`;

                if (result.patch_scores) {
                    renderGrid(result.patch_scores, patchGrid);
                    patchContainer.classList.remove('hidden');
                }

                // Clear after success
                setTimeout(() => {
                    statusArea.classList.add('hidden');
                    document.getElementById('filename-display').innerText = "Select a file to broadcast...";
                    fileInput.value = '';
                }, 6000);
            }
        }

        function renderGrid(scores, container) {
            container.innerHTML = '';
            scores.forEach(s => {
                const div = document.createElement('div');
                // Color scale
                const isBad = s > 0.5;
                div.className = `w-full h-full rounded flex items-center justify-center text-[10px] font-mono border ${isBad ? 'bg-red-500/30 border-red-500/50 text-red-200' : 'bg-green-500/30 border-green-500/50 text-green-200'}`;
                div.innerText = s.toFixed(2);
                container.appendChild(div);
            });
        }

        function addSystemMessage(msg) {
            const msgs = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = "message system text-center text-gray-500 text-xs uppercase tracking-widest my-2";
            div.innerText = msg;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function addMediaMessage(data) {
            const msgs = document.getElementById('messages');
            const isMe = data.username === username;

            const div = document.createElement('div');
            div.className = `msg-bubble ${isMe ? 'own' : 'other'} flex flex-col gap-2`;

            let content = '';
            if (data.is_image) {
                content = `<div class="relative group rounded-lg overflow-hidden border border-white/10">
                    <img src="${data.file_url}" class="max-w-full rounded-lg" onload="this.parentElement.parentElement.scrollIntoView()">
                    <div class="absolute inset-0 bg-green-500/10 pointer-events-none"></div>
                    <div class="absolute bottom-2 right-2 bg-black/60 px-2 py-1 rounded text-[10px] backdrop-blur text-green-400 border border-green-500/30 flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        VERIFIED REAL
                    </div>
                </div>`;
            } else {
                content = `<video controls src="${data.file_url}" class="max-w-full rounded-lg border border-white/10"></video>`;
            }

            div.innerHTML = `
                <div class="flex items-center justify-between text-xs opacity-70 mb-1">
                    <span class="font-bold">${data.username}</span>
                    <span>${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                </div>
                ${content}
            `;

            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function showToast(title, msg, type) {
            const toast = document.getElementById('toast');
            const colors = type === 'error' ? 'border-red-500 text-red-400' : 'border-green-500 text-green-400';

            toast.className = `fixed top-6 right-6 p-4 rounded-xl glass shadow-2xl transition-all duration-300 flex items-center gap-3 z-50 border-l-4 ${colors}`;
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-msg').innerText = msg;

            toast.classList.remove('hidden', 'translate-x-64');

            setTimeout(() => {
                toast.classList.add('translate-x-64');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 4000);
        }

        function hoverShake(el) {
            el.classList.add('animate-pulse', 'border-red-500');
            setTimeout(() => el.classList.remove('animate-pulse', 'border-red-500'), 500);
        }
    </script>
</body>

</html>
