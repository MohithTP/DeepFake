<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel | Deepfake Defense Grid</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Space Grotesk', 'monospace'],
                    },
                    colors: {
                        cyber: {
                            black: '#020408',
                            dark: '#0B101B',
                            light: '#1B2436',
                            primary: '#00F0FF', /* Cyber Cyan */
                            primaryDim: 'rgba(0, 240, 255, 0.1)',
                            accent: '#7000FF', /* Neon Purple */
                            success: '#00FF94', /* Matrix Green */
                            danger: '#FF0055', /* Cyber Red */
                            warning: '#FFD600',
                            text: '#E0E6ED',
                            muted: '#94A3B8'
                        }
                    },
                    backgroundImage: {
                        'grid-pattern': "linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px)",
                        'radial-glow': "radial-gradient(circle at center, rgba(0, 240, 255, 0.15) 0%, transparent 70%)"
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s infinite',
                        'spin-slow': 'spin 8s linear infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 10px rgba(0, 240, 255, 0.2)' },
                            '50%': { boxShadow: '0 0 20px rgba(0, 240, 255, 0.6)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #020408;
            color: #E0E6ED;
        }

        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        .cyber-border {
            position: relative;
            background: rgba(11, 16, 27, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .cyber-border::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 10px;
            height: 10px;
            border-top: 2px solid #00F0FF;
            border-left: 2px solid #00F0FF;
        }

        .cyber-border::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 10px;
            height: 10px;
            border-bottom: 2px solid #00F0FF;
            border-right: 2px solid #00F0FF;
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .neon-text-danger {
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0B101B;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1B2436;
            border-radius: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #00F0FF;
        }

        /* Message Bubbles */
        .msg-own {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1) 0%, rgba(0, 240, 255, 0.05) 100%);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px 12px 0 12px;
        }

        .msg-other {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px 12px 12px 0;
        }
    </style>
</head>

<body class="h-screen w-screen overflow-hidden flex flex-col bg-grid relative text-cyber-text font-sans">

    <!-- Ambient Glow -->
    <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-cyber-primary/5 rounded-full blur-[120px] pointer-events-none z-0">
    </div>

    <!-- MAIN APP CONTAINER -->
    <div class="relative z-10 w-full h-full flex flex-col items-center justify-center p-4">

        <!-- LOG IN PANEL -->
        <div id="login-screen"
            class="w-full max-w-lg cyber-border p-10 flex flex-col items-center gap-6 shadow-2xl shadow-cyber-primary/10 transition-all duration-500">
            <div class="w-24 h-24 rounded-full border-2 border-cyber-primary p-1 animate-pulse-glow relative">
                <div
                    class="w-full h-full bg-cyber-primary/10 rounded-full flex items-center justify-center overflow-hidden relative">
                    <!-- <div
                        class="absolute inset-0 bg-[url('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbm95ZnJ3eXJ3eXJ3eXJ3eXJ3eXJ3eXJ3eXJ3eXJ3eXJ3eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKSjRrfIPjeiVyM/giphy.gif')] bg-cover opacity-20 mix-blend-screen">
                    </div> -->
                    <svg class="w-10 h-10 text-cyber-primary relative z-10" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </div>
            </div>

            <div class="text-center space-y-2">
                <h1 class="text-4xl font-mono font-bold text-white tracking-tighter uppercase neon-text">Sentinel<span
                        class="text-cyber-primary">.AI</span></h1>
                <p class="text-cyber-muted text-sm font-mono tracking-widest uppercase">Deepfake Interception Interface
                </p>
            </div>

            <div class="w-full relative group">
                <div
                    class="absolute -inset-0.5 bg-gradient-to-r from-cyber-primary to-cyber-accent rounded-lg blur opacity-30 group-hover:opacity-75 transition duration-1000 group-hover:duration-200">
                </div>
                <input type="text" id="username-input"
                    class="relative w-full bg-cyber-dark border border-gray-800 text-white px-6 py-4 rounded-lg focus:outline-none focus:border-cyber-primary placeholder-gray-600 font-mono"
                    placeholder="IDENTIFY_YOURSELF // >">
            </div>

            <button onclick="joinChat()"
                class="w-full bg-cyber-primary/10 hover:bg-cyber-primary/20 text-cyber-primary border border-cyber-primary/50 font-bold py-3 px-8 rounded-lg transition-all transform hover:scale-[1.02] active:scale-95 uppercase tracking-widest font-mono text-sm group flex items-center justify-center gap-3">
                <span>Access Network</span>
                <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </div>


        <!-- DASHBOARD CONTAINER -->
        <div id="chat-screen"
            class="hidden w-full max-w-5xl h-[95vh] cyber-border flex flex-col shadow-2xl overflow-hidden relative">

            <!-- Removed Scan Line Overlay and Sidebar as requested -->

            <!-- Chat Header -->
            <div
                class="h-16 border-b border-white/5 flex items-center justify-between px-6 bg-cyber-dark/50 backdrop-blur-sm z-20">
                <h2 class="font-mono font-bold text-lg tracking-wider text-white flex items-center gap-2">
                    <span class="text-cyber-primary">#</span> SECURE_CHANNEL_01
                </h2>
                <div class="flex items-center gap-4">
                    <span id="current-user-display" class="text-gray-400 text-xs font-mono">--</span>
                    <!-- <span
                        class="px-2 py-1 rounded bg-cyber-primary/10 border border-cyber-primary/30 text-cyber-primary text-[10px] uppercase font-bold tracking-wider">Top
                        Secret</span> -->
                </div>
            </div>

            <!-- Messages -->
            <div id="messages" class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar relative">
                <!-- Intro Message -->
                <div class="flex justify-center my-4">
                    <div
                        class="bg-cyber-primary/5 border border-cyber-primary/20 px-4 py-2 rounded-full text-xs font-mono text-cyber-primary uppercase tracking-widest">
                        Sentinel.AI Active - Monitoring Media Integrity
                    </div>
                </div>
            </div>

            <!-- Input Area (Status + Controls) -->
            <div class="p-6 bg-cyber-dark border-t border-white/5 z-20">

                <!-- Dynamic Status Bar -->
                <div id="status-bar-container"
                    class="hidden mb-4 relative overflow-hidden rounded-lg border border-gray-800 bg-gray-900/50 p-4 transition-all duration-300">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-3">
                            <div id="status-icon" class="animate-spin-slow text-cyber-primary">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                </svg>
                            </div>
                            <div>
                                <div id="status-text"
                                    class="text-sm font-bold text-white uppercase tracking-wider font-mono">Analyzing...
                                </div>
                                <div id="status-sub" class="text-xs text-cyber-muted font-mono">Processing media through
                                    neural network</div>
                            </div>
                        </div>
                        <div id="status-score" class="font-mono text-xl font-bold text-gray-500">0%</div>
                    </div>
                    <!-- Progress Bar -->
                    <div class="h-1 w-full bg-gray-800 rounded-full overflow-hidden">
                        <div id="progress-bar-fill" class="h-full bg-cyber-primary w-0 transition-all duration-300">
                        </div>
                    </div>

                    <!-- Patch Grid (Visualizer) -->
                    <div id="patch-grid-container" class="hidden mt-3 pt-3 border-t border-gray-800">
                        <div class="text-[10px] text-gray-500 uppercase tracking-widest mb-2 font-mono">Patch Anomaly
                            Analysis</div>
                        <div id="patch-grid" class="grid grid-cols-3 gap-1 w-24 h-24"></div>
                    </div>
                </div>

                <!-- Input Controls -->
                <div class="flex items-center gap-4">
                    <label class="cursor-pointer group relative">
                        <input type="file" id="file-input" class="hidden" accept="image/*,video/*">
                        <div
                            class="w-12 h-12 bg-gray-800 rounded-lg flex items-center justify-center border border-gray-700 group-hover:border-cyber-primary group-hover:text-cyber-primary transition-all text-gray-400">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                    </label>

                    <div class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-sm text-gray-400 font-mono overflow-hidden whitespace-nowrap text-ellipsis"
                        id="filename-display">
                        No Item Selected...
                    </div>

                    <button onclick="uploadMedia()"
                        class="bg-cyber-primary hover:bg-cyan-400 text-black font-bold py-3 px-8 rounded-lg shadow-[0_0_15px_rgba(0,240,255,0.4)] hover:shadow-[0_0_25px_rgba(0,240,255,0.6)] transition-all uppercase tracking-widest text-sm flex items-center gap-2">
                        <span>Upload</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- NOTIFICATION TOAST -->
    <div id="toast" class="fixed top-8 right-8 z-50 transform translate-x-96 transition-all duration-500">
        <div
            class="bg-cyber-dark/95 border-l-4 border-cyber-primary p-4 rounded shadow-2xl backdrop-blur flex items-start gap-4 max-w-sm">
            <div id="toast-icon" class="mt-1"></div>
            <div>
                <h4 id="toast-title" class="font-bold text-white text-sm uppercase tracking-wider mb-1">Notification
                </h4>
                <p id="toast-msg" class="text-xs text-gray-400 font-mono"></p>
            </div>
        </div>
    </div>


    <script>
        const socket = io();
        let username = '';
        const fileInput = document.getElementById('file-input');
        let statusTimeout = null;

        // --- UI Logic ---

        fileInput.addEventListener('change', (e) => {
            // Reset previous status immediately upon new file selection
            const statusBar = document.getElementById('status-bar-container');
            if (!statusBar.classList.contains('hidden')) {
                statusBar.classList.add('hidden');
                clearTimeout(statusTimeout);
            }

            const name = e.target.files[0]?.name || "No Item Selected...";
            const display = document.getElementById('filename-display');
            display.innerText = name;
            display.classList.toggle('text-cyber-primary', !!e.target.files[0]);
            display.classList.toggle('text-gray-400', !e.target.files[0]);
        });

        function joinChat() {
            const input = document.getElementById('username-input');
            username = input.value.trim();
            if (!username) {
                input.parentElement.classList.add('shake');
                setTimeout(() => input.parentElement.classList.remove('shake'), 400);
                return;
            }

            const login = document.getElementById('login-screen');
            const chat = document.getElementById('chat-screen');

            login.style.opacity = '0';
            login.style.transform = 'scale(0.9)';

            setTimeout(() => {
                login.classList.add('hidden');
                chat.classList.remove('hidden');
                document.getElementById('current-user-display').innerText = username;
                socket.emit('join', { username: username });
            }, 500);
        }

        // --- Socket Listeners ---

        socket.on('status_message', (data) => {
            appendSystemMessage(data.msg);
        });

        socket.on('new_media', (data) => {
            appendMessage(data, false);
        });

        socket.on('blocked_alert', (data) => {
            appendBlockedAlert(data);
        });

        socket.on('status_update', (data) => {
            const statusSub = document.getElementById('status-sub');
            const progress = document.getElementById('progress-bar-fill');
            const scoreLabel = document.getElementById('status-score');

            if (statusSub) statusSub.innerText = data.msg;

            // Try parse percentage from "Analyzing Face Batch #5/30"
            if (data.msg.includes('/')) {
                const parts = data.msg.match(/(\d+)\s*\/\s*(\d+)/);
                if (parts && parts.length === 3) {
                    const current = parseInt(parts[1]);
                    const total = parseInt(parts[2]);
                    if (total > 0) {
                        const pct = Math.floor((current / total) * 100);
                        progress.style.width = `${pct}%`;
                        scoreLabel.innerText = `${pct}%`;
                    }
                }
            } else if (data.msg.includes('Scanning frame stream')) {
                // Indeterminate active state
                progress.style.width = "20%"; // Starting
                scoreLabel.innerText = "20%";
            }
        });

        // --- Upload Flow ---

        async function uploadMedia() {
            const file = fileInput.files[0];
            if (!file) return;

            // Reset UI
            const statusBar = document.getElementById('status-bar-container');
            const statusText = document.getElementById('status-text');
            const statusSub = document.getElementById('status-sub');
            const progress = document.getElementById('progress-bar-fill');
            const patchGridContainer = document.getElementById('patch-grid-container');
            const patchGrid = document.getElementById('patch-grid');
            const scoreLabel = document.getElementById('status-score');

            // Clear any lingering timeouts
            if (statusTimeout) clearTimeout(statusTimeout);

            statusBar.classList.remove('hidden', 'border-red-600', 'border-green-500', 'bg-red-900/30', 'bg-green-900/30');
            statusBar.classList.add('border-cyber-primary', 'bg-cyber-primary/10');
            patchGridContainer.classList.add('hidden');

            statusText.innerText = "SCANNING FOR DEEPFAKES...";
            statusText.className = "text-sm font-bold text-cyber-primary uppercase tracking-wider font-mono";
            statusSub.innerText = "Initializing neural network...";
            progress.style.width = "5%";
            scoreLabel.innerText = "5%";

            const formData = new FormData();
            formData.append('file', file);
            formData.append('username', username);
            if (socket.id) formData.append('socket_id', socket.id);

            try {
                const response = await fetch('/api/upload', { method: 'POST', body: formData });
                const result = await response.json();

                // Jump to 100% on done
                progress.style.width = "100%";
                scoreLabel.innerText = "100%";

                setTimeout(() => handleResult(result, file.name), 200);

            } catch (err) {
                console.error(err);
                showToast("Upload Error", "Server communication failed", "error");
                statusBar.classList.add('hidden');
            }
        }

        function handleResult(result, filename) {
            const statusBar = document.getElementById('status-bar-container');
            const statusText = document.getElementById('status-text');
            const statusSub = document.getElementById('status-sub');
            const patchGridContainer = document.getElementById('patch-grid-container');
            const patchGrid = document.getElementById('patch-grid');

            if (result.status === 'blocked') {
                // BLOCKED UI STATE
                statusBar.classList.remove('border-cyber-primary', 'bg-cyber-primary/10');
                statusBar.classList.add('border-red-600', 'bg-red-900/30');
                statusText.innerText = "THREAT NEUTRALIZED";
                statusText.className = "text-sm font-bold text-red-500 uppercase tracking-wider font-mono animate-pulse";
                statusSub.innerText = `Deepfake score: ${result.score.toFixed(4)}. Content dropped.`;
                showToast("Security Alert", "Deepfake content blocked internally.", "error");

                // Render Patch Grid
                if (result.patch_scores && result.patch_scores.length > 0) {
                    renderGrid(result.patch_scores, patchGrid);
                    patchGridContainer.classList.remove('hidden');
                }

                // Blocked Cooldown: 20s
                statusTimeout = setTimeout(() => {
                    statusBar.classList.add('hidden');
                    resetInput();
                }, 20000);

            } else {
                // SUCCESS UI STATE
                statusBar.classList.remove('border-cyber-primary', 'bg-cyber-primary/10');
                statusBar.classList.add('border-green-500', 'bg-green-900/30');
                statusText.innerText = "VERIFIED AUTHENTIC";
                statusText.className = "text-sm font-bold text-cyber-success uppercase tracking-wider font-mono";
                statusSub.innerText = `Score: ${result.score.toFixed(4)}. Broadcasting to secure channel...`;
                showToast("Verified", "Content safe. Broadcasting...", "success");

                // Success Cooldown: 10s
                statusTimeout = setTimeout(() => {
                    statusBar.classList.add('hidden');
                    resetInput();
                }, 10000);
            }
        }

        function renderGrid(scores, container) {
            container.innerHTML = '';
            scores.forEach(s => {
                const div = document.createElement('div');
                const isBad = s > 0.5;
                div.className = `w-full h-full rounded flex items-center justify-center text-[10px] font-mono border ${isBad ? 'bg-red-500/30 border-red-500/50 text-red-200' : 'bg-green-500/30 border-green-500/50 text-green-200'}`;
                div.innerText = s.toFixed(2);
                container.appendChild(div);
            });
        }

        function resetInput() {
            fileInput.value = '';
            const display = document.getElementById('filename-display');
            display.innerText = "No Item Selected...";
            display.className = "flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-sm text-gray-400 font-mono overflow-hidden whitespace-nowrap text-ellipsis";
            display.classList.remove('text-cyber-primary');
            display.classList.add('text-gray-400');
        }


        // --- Chat Messages ---

        function appendMessage(data, isSystem) {
            const msgs = document.getElementById('messages');
            const isMe = data.username === username;

            const div = document.createElement('div');
            div.className = `flex flex-col gap-1 w-full max-w-[85%] ${isMe ? 'items-end ml-auto' : 'items-start'}`;

            const label = document.createElement('div');
            label.className = "flex items-center gap-2 text-[10px] text-gray-400 uppercase font-mono tracking-wider";
            label.innerHTML = `<span class="${isMe ? 'text-cyber-primary' : 'text-gray-300'} font-bold">${data.username}</span> • ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

            const bubble = document.createElement('div');
            bubble.className = isMe ? 'msg-own p-3' : 'msg-other p-3';

            let contentHtml = '';
            if (data.is_image) {
                contentHtml = `
                    <div class="relative group rounded overflow-hidden border border-white/10">
                        <img src="${data.file_url}" class="max-w-xs md:max-w-md w-full object-cover">
                        <div class="absolute bottom-2 right-2 flex items-center gap-1 bg-black/70 backdrop-blur px-2 py-1 rounded border border-cyber-success/30 text-cyber-success text-[10px] uppercase font-bold tracking-widest">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> 
                            Real
                        </div>
                    </div>
                `;
            } else {
                contentHtml = `
                    <div class="relative group rounded overflow-hidden border border-white/10">
                        <video controls src="${data.file_url}" class="max-w-xs md:max-w-md w-full"></video>
                         <div class="mt-2 flex items-center gap-1 text-cyber-success text-[10px] uppercase font-bold tracking-widest">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> 
                            Video Integrity Verified
                        </div>
                    </div>
                `;
            }

            bubble.innerHTML = contentHtml;
            div.appendChild(label);
            div.appendChild(bubble);
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function appendBlockedAlert(data) {
            const msgs = document.getElementById('messages');

            const div = document.createElement('div');
            // Center alert
            div.className = "w-full flex justify-center my-6 opacity-0 animate-[pulse_0.5s_ease-in_forwards]";

            // Manually handle animation
            setTimeout(() => div.classList.remove('opacity-0'), 50);

            div.innerHTML = `
                <div class="w-full max-w-2xl bg-red-900/10 border-l-4 border-red-600 p-4 rounded-r flex items-start gap-4 backdrop-blur-sm relative overflow-hidden">
                    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/diagonal-striped-brick.png')] opacity-10"></div>
                    <div class="text-red-500 mt-1 animate-pulse">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                    </div>
                    <div class="flex-1 z-10">
                        <h3 class="text-red-500 font-bold uppercase tracking-widest text-sm mb-1">Security Alert: Threat Neutralized</h3>
                        <p class="text-gray-300 text-xs font-mono">
                            A file uploaded by <span class="text-white font-bold underline decoration-red-500">${data.username}</span> (${data.filename}) was identified as a Deepfake (Score: ${data.score.toFixed(3)}) and successfully blocked.
                        </p>
                    </div>
                </div>
            `;

            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function appendSystemMessage(msg) {
            const msgs = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = "flex justify-center my-2";
            div.innerHTML = `<div class="bg-gray-800/50 border border-gray-700/50 px-3 py-1 rounded-full text-[10px] font-mono text-gray-400 uppercase tracking-widest">${msg}</div>`;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function showToast(title, msg, type) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const colorClass = type === 'error' ? 'border-red-500' : 'border-cyber-success';

            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-title').className = `font-bold text-sm uppercase tracking-wider mb-1 ${type === 'error' ? 'text-red-500 neon-text-danger' : 'text-cyber-success neon-text'}`;
            document.getElementById('toast-msg').innerText = msg;

            toast.className = `fixed top-8 right-8 z-50 transform transition-all duration-500 bg-cyber-dark/95 border-l-4 p-4 rounded shadow-2xl backdrop-blur flex items-start gap-4 max-w-sm ${colorClass}`;

            if (type === 'error') {
                icon.innerHTML = `<svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;
            } else {
                icon.innerHTML = `<svg class="w-6 h-6 text-cyber-success" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;
            }

            toast.classList.remove('translate-x-96');

            setTimeout(() => {
                toast.classList.add('translate-x-96');
            }, 5000);
        }

        const style = document.createElement('style');
        style.type = 'text/css';
        style.innerHTML = `
            @keyframes shake {
                0%, 100% {transform: translateX(0);}
                10%, 30%, 50%, 70%, 90% {transform: translateX(-4px);}
                20%, 40%, 60%, 80% {transform: translateX(4px);}
            }
            .shake {animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;}
        `;
        document.getElementsByTagName('head')[0].appendChild(style);

    </script>
</body>

</html>
